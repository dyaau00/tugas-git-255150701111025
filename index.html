<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Tabel Riwayat Pendidikan</title>
    <style>
        table, th, td {
            border: 1px solid #a24270;
            border-collapse: collapse;
            padding: 8px 12px;
        }
        th {
            background-color: #f6e6ed;
        }
        td {
            background-color: #fdf5f8;
        }
    </style>
</head>
<body>

        </tr>

        </tr>
        <tr>

            <td></td>

        </tr>
        <tr>
            <td align="center">4.</td>
            <td>Nama SMA</td>

    </table>

</body>
</html>
